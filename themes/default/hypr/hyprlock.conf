# hyprlock — Tokyo Night, matches ~/.config/kitty/kitty.conf
# https://wiki.hyprland.org/Hypr-Ecosystem/hyprlock

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = false
    grace = 0
}

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =
    path = $HOME/.config/hypr/wallpaper.jpg
    blur_passes = 3
    blur_size = 7
    brightness = 0.55
    contrast = 0.95
    vibrancy = 0.2
}

input-field {
    monitor =
    size = 300, 60
    outline_thickness = 3
    inner_color = rgba(26, 27, 38, 0.55)

    outer_color = rgba(82aaffee) rgba(73dacaee) 45deg
    check_color = rgba(73dacaee) rgba(82aaffee) 120deg
    fail_color = rgba(f7768eee) rgba(f7768eee) 40deg

    font_color = rgb(192, 202, 245)
    fade_on_empty = false
    rounding = 20

    font_family = $font
    placeholder_text = <i>Enter password...</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    dots_spacing = 0.3

    position = 0, -140
    halign = center
    valign = center
}

# CLOCK
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font
    color = rgb(192, 202, 245)

    position = 0, 160
    halign = center
    valign = center
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    font_size = 24
    font_family = $font
    color = rgb(130, 170, 255)

    position = 0, 60
    halign = center
    valign = center
}

# GREETING
label {
    monitor =
    text = Hey jonah, welcome back
    font_size = 20
    font_family = $font
    color = rgb(120, 124, 153)

    position = 0, -60
    halign = center
    valign = center
}
